bundle:
  name: databricks-telematics-pipeline

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog
    default: telematics

  schema:
    description: Target schema

  landing_volume:
    description: Landing volume name
    default: landing

targets:
  dev:
    mode: development
    default: true
    variables:
      catalog: telematics
      schema: dev
      landing_volume: landing

  test:
    mode: development
    variables:
      catalog: telematics
      schema: test
      landing_volume: landing

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/orsondc@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: telematics
      schema: prod
      landing_volume: landing