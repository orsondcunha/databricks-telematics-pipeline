resources:
  jobs:
    telematics_pipeline:
      name: telematics-pipeline-${bundle.target}

      tasks:

        - task_key: bronze_ingestion

          spark_python_task:
            python_file: ../src/bronze/bronze_ingestion.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
              - --landing_volume
              - ${var.landing_volume}

          environment_key: default


        - task_key: silver_processing

          depends_on:
            - task_key: bronze_ingestion

          spark_python_task:
            python_file: ../src/silver/silver_processing.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
              - --landing_volume
              - ${var.landing_volume}

          environment_key: default


        - task_key: gold_processing

          depends_on:
            - task_key: silver_processing

          spark_python_task:
            python_file: ../src/gold/gold_processing.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
              - --landing_volume
              - ${var.landing_volume}

          environment_key: default


      environments:
        - environment_key: default
          spec:
             environment_version: "5"